<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Welcome</title>

    <meta name="robots" content="noindex,nofollow">
  </head>
  <body>
    <div class="container">
      <div id="header" class="row">
        <div id="links" class="col-sm-6 text-md-start">
          <p><img src="https://cdn.brandfolder.io/5H442O3W/as/pl546j-7le8zk-4nzzs1/Slack_Mark_Web.png"
            height=50 width=50 class="float-start"/>
          <a href="https://slack.lansing.codes">slack.lansing.codes</a></p>
          <p>placeholder for meetup link</p>
        </div>
        <div id="wificode" class="col-sm-6 text-md-end">
          <!-- fields should be editable locally once slide is loaded -->
          <label for="ssid">WiFi SSID:</label>
          <input type="text" id="ssid" name="ssid" placeholder="ssid"></input>
          <label for="pass">WiFi Password:</label>
          <input type="text" id="pass" name="pass" placeholder="thepass"></input>
        </div>
      </div>

      <div id="main-text" class="d-flex">
        <!-- generate welcome page details from url -->
        <div class="col-sm-3 flex-row">
          <img id="sponsor-image" class="float-end responsive" alt="Sponsor Image"
            src="/placeholder.svg"/>
        </div>
        <div class="col-sm-6 text-center align-center flex-row flex-grow-1">
          <h1 id=meetup>Meeting Name</h1>
          <h1 id=speaker>Speaker</h1>
          <h2 id=topic>Topic</h2>
        </div>
        <div class="col-sm-3 flex-row">
          <img id="speaker-image" class="float-start responsive" alt="Speaker Image"
            src="/placeholder.svg"/>
        </div>      
      </div>

      <div id="footer" class="row">
        <div id="lc-events" class="col-sm-6 text-md-start">
          <!-- api call to generate list of items -->
          <p>list of next 3 upcoming Lansing Codes events</p>
        </div>
        <div id="meetup-events" class="col-sm-6 text-md-end">
          <!-- api call to generate list of items -->
          <p>list of next 3 upcoming events for this meetup</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
